
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora - Despliegue Continuo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #101c2e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .contenedor {
            background: #1a2e49;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            width: 340px;
        }

        h1 { color: #3bcaa9; }

        input {
            padding: 12px;
            width: 85%;
            margin: 8px;
            border: none;
            border-radius: 6px;
        }

        button {
            background: #3bcaa9;
            border: none;
            padding: 12px;
            margin: 4px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #resultado {
            font-size: 22px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Calculadora Web</h1>
        <p>Proyecto de Integración y Despliegue Continuo</p>
        <h3>Versión 1.0</h3>

        <input type="number" id="numero1" placeholder="Primer número">
        <input type="number" id="numero2" placeholder="Segundo número">

        <div>
            <button onclick="operar('+')">+</button>
            <button onclick="operar('-')">−</button>
            <button onclick="operar('*')">×</button>
            <button onclick="operar('/')">÷</button>
        </div>

        <p id="resultado">Resultado: --</p>
        <p>Estado: Versión inicial</p>
    </div>

    <script>
        function operar(op) {
            const a = document.getElementById("numero1").value;
            const b = document.getElementById("numero2").value;
            const salida = document.getElementById("resultado");

            if (a === "" || b === "") {
                salida.textContent = "Ingresa ambos números";
                return;
            }

            const x = Number(a);
            const y = Number(b);
            let resultado;

            switch (op) {
                case "+": resultado = x + y; break;
                case "-": resultado = x - y; break;
                case "*": resultado = x * y; break;
                case "/":
                    if (y === 0) {
                        salida.textContent = "Error: División entre cero";
                        return;
                    }
                    resultado = x / y;
                    break;
            }

            salida.textContent = "Resultado: " + resultado;
        }
    </script>
</body>
</html>
