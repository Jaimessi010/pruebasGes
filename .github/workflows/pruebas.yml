
name: Pruebas de Calculadora Python

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  pruebas-unitarias:
    name: Ejecutar pruebas con Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "9.99"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Verificar sintaxis de Python
        run: |
          python -m compileall -q calculadora.py operaciones.py tests

      - name: Ejecutar las pruebas unitarias
        run: |
          python -m pytest -v

      - name: Generar resumen de resultados
        if: always()
        run: |
          echo "## Resultados de pruebas de la calculadora" >> "$GITHUB_STEP_SUMMARY"
          echo "Se ejecutaron las pruebas automatizadas con Pytest." >> "$GITHUB_STEP_SUMMARY"
          echo "Consulta el paso de pruebas para ver los resultados individuales." >> "$GITHUB_STEP_SUMMARY"
